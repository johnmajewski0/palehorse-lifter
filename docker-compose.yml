services:
  lifter:
    build:
      context: .
      dockerfile: Dockerfile
    image: palehorse-lifter:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8085:80"
    depends_on:
      api:
        condition: service_started
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env.backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env.backend
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 12
      timeout: 3s
    security_opt:
      - no-new-privileges:true

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env.backend
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pg_backups:/backups
      - ./ops/backup.sh:/scripts/backup.sh:ro
    command: ["sh", "/scripts/backup.sh"]
    security_opt:
      - no-new-privileges:true

volumes:
  pg_data:
  pg_backups:
